<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduVision - Students</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#5b61eb',
                        navy: '#1a1a2e',
                        accentPink: '#f43f5e',
                        accentGreen: '#10b981',
                        accentBlue: '#3b82f6',
                        accentPurple: '#8b5cf6',
                        accentYellow: '#f59e0b',
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body id="studentsMain" class="bg-navy">
    <div class="flex h-screen overflow-hidden">
        <!-- Sidebar -->
        <aside class="w-64 glass-deep m-4 flex flex-col rounded-3xl overflow-hidden shadow-2xl hidden md:flex">
            <div class="p-6">
                <a href="index.html" class="block cursor-pointer">
                    <h1 class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-purple-600 to-blue-600 hover:opacity-80 transition">EduVision</h1>
                </a>
            </div>
            <nav class="flex-1 px-4 space-y-2 mt-4">
                <a href="dashboard.html" class="flex items-center gap-3 px-4 py-3 text-gray-600 hover:bg-gray-50 rounded-xl transition">
                    <i data-lucide="layout-dashboard" class="w-5 h-5"></i> Dashboard
                </a>
                <a href="courses.html" class="flex items-center gap-3 px-4 py-3 text-gray-600 hover:bg-gray-50 rounded-xl transition">
                    <i data-lucide="book-open" class="w-5 h-5"></i> Courses
                </a>
                <a href="students.html" class="flex items-center gap-3 px-4 py-3 bg-primary/10 text-primary font-medium rounded-xl transition">
                    <i data-lucide="users" class="w-5 h-5"></i> Students
                </a>
                <a href="grades.html" class="flex items-center gap-3 px-4 py-3 text-gray-600 hover:bg-gray-50 rounded-xl transition">
                    <i data-lucide="bar-chart-2" class="w-5 h-5"></i> Grades
                </a>
                <a href="#" class="flex items-center gap-3 px-4 py-3 text-gray-600 hover:bg-gray-50 rounded-xl transition">
                    <i data-lucide="alert-triangle" class="w-5 h-5"></i> At Risk
                </a>
                <div class="pt-4 mt-4 border-t border-gray-100">
                    <a href="#" class="flex items-center gap-3 px-4 py-3 text-gray-600 hover:bg-gray-50 rounded-xl transition">
                        <i data-lucide="settings" class="w-5 h-5"></i> Settings
                    </a>
                </div>
            </nav>
            <div class="p-4 border-t border-gray-100">
                <button id="logoutBtn" class="w-full py-2 text-sm text-gray-600 hover:text-red-500 transition font-medium">
                    Logout
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 flex flex-col h-full overflow-y-auto p-4 md:p-8">
            <!-- Navbar -->
            <header class="flex justify-between items-center mb-8 glass px-6 py-4">
                <div class="relative w-64">
                    <span class="absolute left-3 top-2.5 text-gray-400"><i data-lucide="search" class="w-5 h-5"></i></span>
                    <input type="text" placeholder="Search students by ID or Name..." class="w-full pl-10 pr-4 py-2 glass-input text-sm" />
                </div>
                <div class="flex items-center gap-4">
                    <button class="text-gray-500 hover:text-primary transition relative">
                        <i data-lucide="bell" class="w-5 h-5"></i>
                        <span class="absolute top-0 right-0 w-2 h-2 bg-red-500 rounded-full"></span>
                    </button>
                    <div class="flex items-center gap-2">
                        <i data-lucide="user-circle" class="w-8 h-8 text-gray-400"></i>
                        <span class="font-medium text-gray-700 hidden sm:block" id="userName">Teacher</span>
                    </div>
                </div>
            </header>

            <div class="flex justify-between items-end mb-8">
                <div>
                    <h2 class="text-2xl font-bold text-gray-800 mb-2 text-white">Student Directory</h2>
                    <p class="text-gray-400 text-sm">Comprehensive view of student academic records and metrics.</p>
                </div>
                <button class="px-4 py-2 bg-primary text-white rounded-lg font-medium transition hover:bg-indigo-600 flex items-center gap-2 shadow-lg shadow-indigo-500/30 text-sm">
                    <i data-lucide="download" class="w-4 h-4"></i> Export CSV
                </button>
            </div>

            <!-- Detailed Students Table -->
            <div class="glass p-6 w-full overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse whitespace-nowrap">
                        <thead>
                            <tr class="border-b border-gray-200/50 text-xs text-gray-500 uppercase tracking-wider">
                                <th class="pb-4 font-bold px-2">Student Name</th>
                                <th class="pb-4 font-bold px-2">ID Number</th>
                                <th class="pb-4 font-bold px-2">Branch/Dept</th>
                                <th class="pb-4 font-bold px-2">Sem</th>
                                <th class="pb-4 font-bold px-2 text-center">Internal (50)</th>
                                <th class="pb-4 font-bold px-2 text-center">External (100)</th>
                                <th class="pb-4 font-bold px-2 text-center">Assignments</th>
                                <th class="pb-4 font-bold px-2 text-center">Attendance</th>
                                <th class="pb-4 font-bold px-2 text-center">Prev GPA</th>
                                <th class="pb-4 font-bold px-2">Risk Status</th>
                            </tr>
                        </thead>
                        <tbody id="detailedStudentTableBody">
                            <!-- Populated by JS -->
                        </tbody>
                    </table>
                </div>
            </div>

        </main>
    </div>

    <!-- Scripts -->
    <script src="firebase.js"></script>
    <script src="script.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
