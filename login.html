<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - EduVision Dashboard</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Custom Styles -->
    <link rel="stylesheet" href="style.css">
    
    <!-- Firebase App (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>
    <div class="flex items-center justify-center min-h-screen p-4">
        <div class="glass p-8 max-w-md w-full floating">
            <div class="text-center mb-8">
                <h2 id="formTitle" class="text-3xl font-bold text-gray-800 mb-2">Welcome Back</h2>
                <p id="formSubtitle" class="text-gray-600">Enter your credentials to access the dashboard</p>
            </div>
            <form id="loginForm" class="space-y-6">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                    <input type="email" id="email" class="w-full px-4 py-3 glass-input text-gray-800" placeholder="teacher@school.edu" required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                    <input type="password" id="password" class="w-full px-4 py-3 glass-input text-gray-800" placeholder="••••••••" required>
                </div>
                <button type="submit" class="w-full py-3 px-4 bg-gradient-to-r from-purple-500 to-blue-500 hover:from-purple-600 hover:to-blue-600 text-white font-bold rounded-xl shadow-lg transform transition hover:-translate-y-1">
                    Sign In
                </button>
                
                <div id="loginError" class="mt-4 p-3 bg-red-100/50 rounded-lg text-sm text-red-600 border border-red-200 hidden">
                    <!-- Error messages will appear here -->
                </div>
                
                <div id="loginNotice" class="mt-4 p-3 bg-yellow-100/50 rounded-lg text-xs text-yellow-800 border border-yellow-200 hidden">
                    <strong>Note:</strong> Firebase is not configured. Logging in will use mock data for demonstration.
                </div>
            </form>
            
            <div class="mt-6 text-center">
                <p class="text-sm text-gray-600">
                    <span id="toggleText">Don't have an account?</span> 
                    <button id="toggleAuthMode" class="font-bold text-purple-600 hover:text-purple-800 transition">Register here</button>
                </p>
            </div>
        </div>
    </div>
    
    <script src="firebase.js"></script>
    <script src="script.js"></script>
</body>
</html>
